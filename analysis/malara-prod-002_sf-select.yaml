input:
  path: outputs/malara-prod-002.h5

analysis:
  method: structure_function

output:
  path: outputs/malara-prod-002_sf.h5.json

structure_function:
  increment_mode: all_spacetime_pairs
  max_pair_lambda_km: 30000.0
  pair_sampling:
    mode: random
    chunk_size: 100000
    n_pairs: 5000000
    max_pairs: null
    random_seed: 12345
  min_order: 1
  max_order: 6
  n_lambda_bins: 18
  lambda_bins_km: null
  scale_ranges_km:
    total: [100.0, 10000.0]
  min_fit_bins: 3
  elsasser:
    velocity: {frame: auto, spacecraft_correction: auto}
    density_normalization: {method: global_per_spacecraft, species: proton}
    mean_subtraction: {method: global_per_spacecraft}
    timebase: {method: slower_of_n_and_v, interpolation: linear}
  plot:
    enabled: true
    path: outputs/malara-prod-002_sf_diagnostic.png
    data_group: observed
    field: z_plus
    member: 0
    normalized_exponents: false
    dpi: 150
