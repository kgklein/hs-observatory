# Cheap publication stage: every path below is an existing analysis product
# produced by elsasser_increment_pdf_static, never a raw observation HDF5 file.
p_value: 0.7
selected_lag_km: 400  # null selects the second-largest usable lag from case 101
denominator_tolerance: 1.0e-12
difference_y_min: 1.0e-4
wasserstein_x_min: 0.001  # exact zeros are shown with a left-pointing boundary marker
wasserstein_x_max: 0.5
case_order: supplied  # or: median
all_errors_case: "401"
show_individual_bands: false
append_lag_to_filename: true
dpi: 300

cases:
  "401":
    path: outputs/malara-prod-401_elsasser_increment_pdf.h5
    label: all errors
  # Labels for individual sources are deliberately editable rather than encoded in Python.
  "411": {path: outputs/malara-prod-411_elsasser_increment_pdf.h5, label: timing}
  "421": {path: outputs/malara-prod-421_elsasser_increment_pdf.h5, label: position}
  "431": {path: outputs/malara-prod-431_elsasser_increment_pdf.h5, label: density}
  "441": {path: outputs/malara-prod-441_elsasser_increment_pdf.h5, label: velocity speed}
  "451": {path: outputs/malara-prod-451_elsasser_increment_pdf.h5, label: velocity angle}
  "461": {path: outputs/malara-prod-461_elsasser_increment_pdf.h5, label: magnetic}
  "471": {path: outputs/malara-prod-471_elsasser_increment_pdf.h5, label: alignment}

output:
  figure: outputs/malara-prod-p07_increment_pdf_wasserstein.png
  json: outputs/malara-prod-p07_increment_pdf_wasserstein.json
  csv: outputs/malara-prod-p07_increment_pdf_wasserstein.csv
