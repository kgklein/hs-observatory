input:
  path: outputs/malara-prod-151.h5

analysis:
  method: structure_function

output:
  path: outputs/malara-prod-151_sf_publication.json

structure_function:
  increment_mode: all_spacetime_pairs
  min_pair_lambda_km: 50.0
  max_pair_lambda_km: 30000.0
  pair_sampling:
    mode: adaptive_stratified
    chunk_size: 100000
    target_pairs_per_bin: 500000
    max_candidates: 500000000
    binning_n_pairs: 5000000
    random_seed: 12345
  min_order: 1
  max_order: 6
  n_lambda_bins: 9
  lambda_bins_km: null
  scale_ranges_km:
    total: [300.0, 8000.0]
  min_fit_bins: 3
  elsasser:
    velocity: {frame: auto, spacecraft_correction: auto}
    density_normalization: {method: global_per_spacecraft, species: proton}
    mean_subtraction: {method: global_per_spacecraft}
    timebase: {method: slower_of_n_and_v, interpolation: linear}
  plot:
    enabled: false
    publication:
      enabled: true
      path: outputs/malara-prod-151_sf_publication.png
      p_value: 0.7
      quantity: z_plus
      max_order: 6
      fit_range: total
      dpi: 300
