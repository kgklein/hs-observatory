site_name: HS Observatory
site_description: Configurable synthetic multipoint observatory measurements and scientific analysis.
site_url: https://kgklein.github.io/hs-observatory/
repo_url: https://github.com/kgklein/hs-observatory
repo_name: kgklein/hs-observatory
theme:
  name: material
  logo: assets/figures/HS001-logo_FinalBlackA.png
  favicon: assets/figures/HS-icon.png
  font: false
  palette:
    primary: blue grey
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - assets/stylesheets/header-logo.css
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
exclude_docs: |
  /architecture/README.md
  *~
not_in_nav: |
  /reference/analysis_methods.md
  /research-notes/gradient/magnetic_gradient_divergence_audit.md
  /research-notes/timing/timing_calibration.md
  /research-notes/timing/timing_affine_investigation.md
  /research-notes/timing/timing_quadratic_investigation.md
  /research-notes/sf/malara_direct3d_convergence.md
  /research-notes/sf/malara_field_validation_audit.md
  /research-notes/sf/malara_raw_hs_structure_function.md
  /research-notes/sf/structure_function_duration_angle_a.md
  /research-notes/sf/structure_function_duration_comparison.md
  /research-notes/sf/structure_function_duration_convergence.md
  /research-notes/sf/structure_function_duration_convergence_500.md
  /research-notes/sf/structure_function_duration_convergence_500a.md
  /research-notes/sf/structure_function_duration_convergence_502a.md
  /research-notes/sf/structure_function_moment_convergence.md
  /research-notes/sf/structure_function_pair_sampling_audit.md
  /research-notes/sf/structure_function_stage3_publication.md
  /research-notes/sf/structure_function_uniform_binning_test.md
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - First Light: getting-started/quick-start.md
      - First Analysis: getting-started/first-analysis.md
  - Generate: user-guide/generation.md
  - Analyze: user-guide/analysis.md
  - Visualize: user-guide/visualization.md
  - Movies: user-guide/movies.md
  - Scientific Reference:
      - Configuration and commands: reference/configuration.md
      - Data products: reference/data-products.md
      - Fields: reference/fields.md
      - Errors: reference/errors.md
      - Statistical methods: reference/statistical-methods.md
      - Magnetic gradients: reference/magnetic-gradients.md
      - Reconstruction: reference/reconstruction.md
      - Shock timing: reference/shock-timing.md
  - Roadmap: roadmap.md
  - Architecture:
      - Overview: architecture/index.md
      - Module dependencies: architecture/module-dependencies.md
  - Developer:
      - Development: developer/index.md
      - Design contracts: developer/design.md
      - Documentation: developer/documentation.md
  - Research Notes:
      - Overview: research-notes/index.md
      - Intermittency recovery: research-notes/intermittency-recovery.md
      - Geometry sampling (Stage 1): research-notes/sf/structure_function_geometry_stage1.md
      - Sampling convergence (Stage 2): research-notes/sf/structure_function_stage2_convergence.md
      - Timing calibration: reference/timing-calibration.md
      - Divergence audit: research-notes/magnetic-gradient-divergence-audit.md
      - Timing investigations: research-notes/timing-investigations.md
