
name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'README.md'
      - 'DESIGN.md'
      - 'src/hs_observatory/**'
      - 'scripts/generate_architecture_graph.py'
      - 'tests/test_architecture_graph.py'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Test architecture tooling
        run: python -m unittest discover -s tests -p test_architecture_graph.py

      - name: Regenerate architecture diagrams
        run: python scripts/generate_architecture_graph.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
