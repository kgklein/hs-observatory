name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'README.md'
      - 'DESIGN.md'
      - 'src/hs_observatory/**'
      - 'scripts/generate_architecture_graph.py'
      - 'tests/test_architecture_graph.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'README.md'
      - 'DESIGN.md'
      - 'src/hs_observatory/**'
      - 'scripts/generate_architecture_graph.py'
      - 'tests/test_architecture_graph.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Test architecture tooling
        run: python -m unittest discover -s tests -p test_architecture_graph.py
      - name: Regenerate architecture diagrams
        run: python scripts/generate_architecture_graph.py
      - name: Build documentation
        run: mkdocs build --strict
      # Build validation only. Future Pages steps are documented in
      # docs/developer/documentation.md; there is no deployment permission/job.
