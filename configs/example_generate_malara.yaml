spacecraft:
  source: cdf
  cdf_directory: ../HelioSwarm/HS-RT/PhB_SRD8_0x78f/
  configuration_time: "2030-06-01T00:00:00"
  fallback_synthetic: true
  velocity_km_s: [100.0, 0.0, 250]

time:
  t_start_s: 0.0
  t_stop_s: 10.
  cadence_s:
    n: 0.125
    v: 0.125
    B: 0.03125

field:
  model: malara_turbulence

  domain:
    L: [100000.0, 100000.0, 100000.0]
    units: km
    origin: [0.0, 0.0, 0.0]

  turbulence:
    geometry: isotropic
    n_scales: 10
    injection_scale_index: 2
    spectral_exponent_h: 0.3333333333333333
    intermittency_p: 0.7
    base_seed: 12345
    realization: 1

  output_fields:
    n:
      background: 5.0
      fluctuation: none

    v:
      background: [400.0, 0.0, 0.0]
      fluctuation: none
      amplitude: 0.0

    B:
      background: [5.0, 0.0, 0.0]
      fluctuation: malara
      amplitude: 0.5

errors:
  random_seed: 12345
  n_mc: 1
  variables:
    n: {model: none}
    v: {model: none}
    B: {model: none}

output:
  path: outputs/synthetic_observations_malara.h5
  write_errors: true

visualization:
  enabled: true
  truth_path: outputs/synthetic_observations_malara_truth.png
  geometry_path: outputs/synthetic_observations_malara_geometry.png
  dpi: 150
