analysis:
  method: elsasser_increment_pdf_static

input:
  path: outputs/full_observations_malara.h5

output:
  path: outputs/malara_elsasser_increment_pdf_static.h5

elsasser_increment_pdf_static:
  datasets:
    - name: truth
      data_group: truth
    - name: observed_mc0
      data_group: observed
      mc_index: 0

  elsasser:
    velocity:
      frame: auto
      spacecraft_correction: auto
    density_normalization:
      method: global_per_spacecraft
      species: proton
    mean_subtraction:
      method: global_per_spacecraft
    timebase:
      method: slower_of_n_and_v
      interpolation: linear

  increments:
    field: both
    plotted_field: z_plus
    component: perpendicular
    statistic: magnitude

  mean_field:
    method: local_pairwise
    fallback: global_mean_B
    min_norm: 1.0e-12

  scale_bins:
    separation: perpendicular
    binning: log
    n_bins: 12
    lambda_min: auto
    lambda_max: auto
    min_samples_per_bin: 50

  pdf_bins:
    normalized_by: geometric_mean
    binning: linear
    n_bins: 100
    x_min: 0.0
    x_max: auto_percentile
    x_max_percentile: 99.5

  pair_sampling:
    mode: all
    chunk_size: 1000000
    max_pairs: null
    random_seed: 12345

  alignment:
    compute: true

  output_samples:
    save: false
    max_samples: 100000

  plot:
    enabled: true
    directory: outputs
    yscale: log
    xscale: linear
    dpi: 150
