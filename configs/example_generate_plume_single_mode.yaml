spacecraft:
  source: cdf
  cdf_directory: ../HelioSwarm/HS-RT/PhB_SRD8_0x78f/
  configuration_time: "2030-06-01T00:00:00"
  fallback_synthetic: true
  velocity_km_s: [100.0, 0.0, 250.]

time:
  t_start_s: 0.0
  t_stop_s: 300.0
  cadence_s:
    n: 0.125
    v: 0.125
    B: 0.03125

field:
  model: plume_single_mode

  background:
    n: 5.0
    v: [0.0, 0.0, 0.0]
    B: [0.0, 0.0, 5.0]

  plume:
    path: ~/Codes/PLUME/data/klein/kaw_check_b00_kperp_1_1000.mode1
    n_components: 2
    row_index: 256
    row_index_base: 0

    T_ref_eV: 10.0
    B_ref_nT: 5.0

    output_species: ref
    phase0: 0.0
    include_growth: false

    geometry:
      k_perp_axis: x
      k_parallel_axis: z

    amplitude:
      B_rms_nT: 0.1

measurement:
  velocity_frame: spacecraft

errors:
  model: observatory
  random_seed: 12345
  n_mc: 10
  timing:
    enabled: true
    requirement_3sigma_ms: 12.5
    model: constant_per_spacecraft
  position:
    enabled: true
    requirement_3sigma_magnitude_km: 2.5
    model: isotropic_3d_gaussian_position_error
  density:
    enabled: true
    requirement_3sigma_fraction: 0.06
    model: multiplicative_bias_plus_ou
    bias_variance_fraction: 0.5
    ou_variance_fraction: 0.5
    ou_correlation_time_s: 1.0
  velocity_speed:
    enabled: true
    requirement_3sigma_fraction: 0.03
    model: multiplicative_bias_plus_ou
    bias_variance_fraction: 0.5
    ou_variance_fraction: 0.5
    ou_correlation_time_s: 1.0
  velocity_angle:
    enabled: true
    requirement_3sigma_deg: 0.25
    model: transverse_ou_rotation
    ou_correlation_time_s: 1.0
  magnetic_dc:
    enabled: true
    requirement_3sigma_nT_per_axis: 0.15
    model: constant_per_axis_offset
  magnetic_ac:
    enabled: true
    model: colored_gaussian_noise_merged_product
    requirement_interpretation: 3sigma_total_vector_asd
    component_distribution: uniform
    anchors:
      - {frequency_Hz: 0.001, asd_pT_per_sqrtHz: 1500.0}
      - {frequency_Hz: 1.0, asd_pT_per_sqrtHz: 15.0}
      - {frequency_Hz: 10.0, asd_pT_per_sqrtHz: 1.5}
    extrapolate_above_10Hz: continue_last_loglog_slope
  alignment:
    enabled: true
    requirement_3sigma_deg_per_axis: 3.0
    model: independent_constant_rotation_B_and_V

output:
  path: outputs/synthetic_observations_plume_single_mode.h5
  write_errors: true

visualization:
  enabled: true
  alfven_enabled: true
  alfven_fluctuations: true
  truth_velocity_frame: spacecraft
  truth_path: outputs/synthetic_observations_plume_single_mode_truth.png
  geometry_path: outputs/synthetic_observations_plume_single_mode_geometry.png
  alfven_path: outputs/synthetic_observations_plume_single_mode_velocity_alfven.png
  dpi: 150
