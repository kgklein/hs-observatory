spacecraft:
  source: cdf
  cdf_directory: ../HelioSwarm/HS-RT/PhB_SRD8_0x78f/
  configuration_time: "2030-06-01T00:00:00"
  fallback_synthetic: true
  velocity_km_s: [100.0, 0.0, 250.0]

time:
  t_start_s: 0.0
  t_stop_s: 300.0
  cadence_s:
    n: 0.125
    v: 0.125
    B: 0.03125

field:
  model: simulation_sampled

  background:
    n: 5.0
    v: [0.0, 0.0, 0.0]
    B: [5.0, 0.0, 0.0]

  simulation:
    format: bp
    sources:
      field: ../gkeyll/data/ot3D_field_75.bp
      moments: ../gkeyll/data/ot3D_ion_75.bp

    # Packed Gkeyll CartGridField conventions for this dataset. The ion
    # components are already bulk velocity; set momentum_density only for files
    # that truly store n*u.
    layout:
      field_variable: CartGridField
      moments_variable: CartGridField
      B_components: [3, 4, 5]
      density_component: 0
      momentum_components: [1, 2, 3]
      velocity_representation: velocity

    coordinates:
      units: rho_p
      box_size_rho_p: [314.15926, 314.15926, 1570.79632]
      rho_p_km: 100.0

    coordinate_mapping:
      # Put H at box center at t_start, then retain the formation translation.
      method: hub_centered
      hub_spacecraft: 0

    boundary: periodic

    fields_are:
      n: total
      v: total
      B: total

    # Convert provider values to cm^-3, km/s, and nT. The reference BP density
    # has mean 100 in code units, so 0.05 maps it to 5 cm^-3.
    scale_factors:
      n: 0.05
      v: 1.0
      B: 1.0

measurement:
  velocity_frame: spacecraft

errors:
  model: observatory
  random_seed: 12345
  n_mc: 10

  timing:
    enabled: true
    requirement_3sigma_ms: 12.5
    model: constant_per_spacecraft

  position:
    enabled: true
    requirement_3sigma_magnitude_km: 2.5
    model: isotropic_3d_gaussian_position_error

  density:
    enabled: true
    requirement_3sigma_fraction: 0.06
    model: multiplicative_bias_plus_ou
    bias_variance_fraction: 0.5
    ou_variance_fraction: 0.5
    ou_correlation_time_s: 1.0

  velocity_speed:
    enabled: true
    requirement_3sigma_fraction: 0.03
    model: multiplicative_bias_plus_ou
    bias_variance_fraction: 0.5
    ou_variance_fraction: 0.5
    ou_correlation_time_s: 1.0

  velocity_angle:
    enabled: true
    requirement_3sigma_deg: 0.25
    model: transverse_ou_rotation
    ou_correlation_time_s: 1.0

  magnetic_dc:
    enabled: true
    requirement_3sigma_nT_per_axis: 0.15
    model: constant_per_axis_offset

  magnetic_ac:
    enabled: true
    model: colored_gaussian_noise_merged_product
    requirement_interpretation: 3sigma_total_vector_asd
    component_distribution: uniform
    anchors:
      - {frequency_Hz: 0.001, asd_pT_per_sqrtHz: 1500.0}
      - {frequency_Hz: 1.0, asd_pT_per_sqrtHz: 15.0}
      - {frequency_Hz: 10.0, asd_pT_per_sqrtHz: 1.5}
    extrapolate_above_10Hz: continue_last_loglog_slope

  alignment:
    enabled: true
    requirement_3sigma_deg_per_axis: 3.0
    model: independent_constant_rotation_B_and_V

output:
  path: outputs/synthetic_observations_simulation_sampled_observatory.h5
  write_errors: true

visualization:
  enabled: true
  alfven_enabled: true
  alfven_fluctuations: true
  truth_velocity_frame: spacecraft
  truth_path: outputs/synthetic_observations_simulation_sampled_observatory_truth.png
  geometry_path: outputs/synthetic_observations_simulation_sampled_observatory_geometry.png
  alfven_path: outputs/synthetic_observations_simulation_sampled_observatory_velocity_alfven.png
  dpi: 150
