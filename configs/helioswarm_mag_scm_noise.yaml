# Approximate digitization of the anticipated merged HelioSwarm MAG+SCM
# noise-floor curve supplied for this analysis; NOT final instrument specifications.
# Working assumption: ASD is per Cartesian component. Pending MAG-team confirmation.
# vector_total instead divides the PSD equally among three isotropic components.
frequency_units: Hz
asd_units: nT/sqrt(Hz)
interpretation: per_component
spectrum:
  - [0.0007, 0.14]
  - [0.001, 0.10]
  - [0.003, 0.064]
  - [0.01, 0.038]
  - [0.03, 0.025]
  - [0.1, 0.017]
  - [0.3, 0.013]
  - [0.6, 0.010]
  - [1.0, 0.0085]
  - [3.0, 0.0050]
  - [10.0, 0.0014]
  - [20.0, 0.00065]
