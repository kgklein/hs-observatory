[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-observatory"
version = "0.1.0"
description = "Generate and analyze synthetic HelioSwarm-like observations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "h5py>=3.8",
  "cdflib>=1.2",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
simulation-bp = ["adios2>=2.10"]

[project.scripts]
hsobs-generate = "hs_observatory.cli:generate_main"
hsobs-analyze = "hs_observatory.cli:analyze_main"
hsobs-plot-figure2 = "hs_observatory.cli:plot_figure2_main"
hsobs-plot-structure-function = "hs_observatory.cli:plot_structure_function_summary_main"
hsobs-plot-increment-pdf = "hs_observatory.cli:plot_increment_pdf_publication_main"
hsobs-plot-increment-pdf-wasserstein = "hs_observatory.cli:plot_increment_pdf_wasserstein_main"
hsobs-plot-magnetic-gradient = "hs_observatory.cli:plot_magnetic_gradient_main"
hsobs-plot-magnetic-gradient-wasserstein = "hs_observatory.cli:plot_magnetic_gradient_wasserstein_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
